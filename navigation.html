<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route Navigator</title>
    <link rel="stylesheet" href="nav.css" />
</head>

<body>
    <div id="main">
        <h1>Route Navigator</h1>
        <input type="text" id="search" placeholder="Search for site number or name" autofocus />
        <div id="results"></div>
        <div id="output"></div>
    </div>
    <div id="notes"></div>

    <script>
    fetch('routes.js', { method: 'HEAD' })
      .then(r => r.headers.get('Last-Modified') || Date.now())
      .then(v => new Promise(resolve => {
        const s = document.createElement('script');
        s.src = 'routes.js?v=' + encodeURIComponent(v);
        s.onload = resolve;
        document.body.appendChild(s);
      }))
      .then(() => {
        const s = document.createElement('script');
        s.src = 'nav.js';
        document.body.appendChild(s);
      });
    </script>
</body>

</html>
