<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Editor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="main">
  <h1>Route Editor</h1>

  <div id="search-row">
    <input type="text" id="search" placeholder="Search routes..." autofocus>
    <button id="addBtn">Add New</button>
  </div>
  <div id="results"></div>

  <div id="editor" style="display:none;">
    <div class="field-group">
      <label for="field-string">Route Name</label>
      <input type="text" id="field-string">
    </div>

    <div class="field-group checkbox-row">
      <input type="checkbox" id="field-flagged">
      <label for="field-flagged">Flagged</label>
    </div>

    <div class="field-group">
      <label for="field-link">Google Maps Link</label>
      <input type="text" id="field-link">
    </div>

    <div class="field-group">
      <label>Notes</label>
      <div id="toolbar">
        <button data-cmd="bold" title="Bold (Ctrl+B)">B</button>
        <button data-cmd="italic" title="Italic (Ctrl+I)">I</button>
        <button data-cmd="underline" title="Underline (Ctrl+U)">U</button>
        <span class="toolbar-sep"></span>
        <button data-cmd="insertUnorderedList" title="Bullet list">UL</button>
        <button data-cmd="insertOrderedList" title="Numbered list">OL</button>
        <span class="toolbar-sep"></span>
        <button id="linkBtn" title="Insert link">Link</button>
        <button id="imgBtn" title="Insert image">Image</button>
      </div>
      <div id="field-notes" contenteditable="true"></div>
    </div>

    <div id="download-row">
      <button id="deleteBtn">Delete</button>
      <button id="downloadBtn">Download</button>
    </div>
    <a id="downloadLink" download="routes.js" type="text/javascript"></a>
  </div>
</div>

<script>
fetch('routes.js', { method: 'HEAD' })
  .then(r => r.headers.get('Last-Modified') || Date.now())
  .then(v => new Promise(resolve => {
    const s = document.createElement('script');
    s.src = 'routes.js?v=' + encodeURIComponent(v);
    s.onload = resolve;
    document.body.appendChild(s);
  }))
  .then(() => {
    const s = document.createElement('script');
    s.src = 'editor.js';
    document.body.appendChild(s);
  });
</script>
</body>
</html>
