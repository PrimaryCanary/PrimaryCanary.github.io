<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Editor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="main">
  <input type="text" id="search" placeholder="Search..." autofocus/>
  <button id="addBtn">Add New</button>
  <div id="results"></div>

  <div id="editor" style="display:none;">
    <label>String:<br><input id="field-string"></label><br>
    <label>Flagged: <input type="checkbox" id="field-flagged"></label><br>
    <label>Link:<br><input id="field-link"></label><br>

    <div id="toolbar">
      <button data-cmd="bold" title="Bold">B</button>
      <button data-cmd="italic" title="Italics">I</button>
      <button data-cmd="underline" title="Underline">U</button>
      <button data-cmd="insertUnorderedList" title="Unordered list">UL</button>
      <button data-cmd="insertOrderedList" title="Ordered list">OL</button>
      <button id="linkBtn" title="Insert link">Link</button>
      <button id="imgBtn" title="Insert image">Image</button>
    </div>

    <div id="field-notes" contenteditable="true"></div>

    <button id="downloadBtn">Download</button>
    <a id="downloadLink" download="routes.js" type="text/javascript"></a>
  </div>
</div>

<script src="routes.js"></script>
<script src="editor.js"></script>
</body>
</html>
